stages:
  - train
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: $CI_REGISTRY_IMAGE/inference-api
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  CHART_PATH: helm
  K8S_NAMESPACE: application
  # MLflow/Registry
  MLFLOW_TRACKING_URI: "http://mlflow.application.svc.cluster.local:5000"
  REGISTERED_MODEL_NAME: "iris_rf_model"
  EXPERIMENT_NAME: "iris_rf_experiment"

default:
  image: python:3.10-slim
  before_script:
    - python -V
    - pip install --no-cache-dir mlflow scikit-learn pandas

train_model:
  stage: train
  script:
    - python model/train.py
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - mlruns/
  only:
    - main
    - merge_requests
    - web

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "FROM python:3.10-slim\nWORKDIR /app\nCOPY app/main.py .\nRUN pip install --no-cache-dir fastapi uvicorn mlflow pandas prometheus-client httpx\nCMD [\"uvicorn\",\"main:app\",\"--host\",\"0.0.0.0\",\"--port\",\"8080\"]" > Dockerfile
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  needs: ["train_model"]
  only:
    - main
    - merge_requests
    - web

deploy_helm:
  stage: deploy
  image: alpine/helm:3.14.4
  before_script:
    - apk add --no-cache git bash yq
    - helm version
    - git config user.email "ci@example.com"
    - git config user.name "gitlab-ci"
  script:
    # оновимо тег образу у values.yaml
    - yq -i ".image.tag = \"$IMAGE_TAG\"" $CHART_PATH/values.yaml
    # (опційно) коміт у той самий репозиторій, якщо GitOps з іншого репо — зроби MR у той репо
    - git add $CHART_PATH/values.yaml
    - git commit -m "ci: bump image tag to $IMAGE_TAG" || true
    - git push origin $CI_COMMIT_REF_NAME || true
    # ArgoCD підхопить зміну і задеплоїть
  needs: ["build_image"]
  only:
    - main
    - web